spring.application.name=MotionVille
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/motionville-fresh;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=510MB
server.error.whitelabel.enabled=false
motionville.storage.directory=${MEDIA_DIRECTORY:./data/media}
