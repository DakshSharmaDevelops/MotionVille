spring.application.name=MotionVille
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/motionville;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=510MB
spring.web.error.whitelabel.enabled=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
motionville.storage.directory=${MEDIA_DIRECTORY:./data/media}
r2.endpoint=${R2_ENDPOINT:http://localhost:9000}
r2.bucket=${R2_BUCKET:test-bucket}
r2.access-key=${R2_ACCESS_KEY:test-access-key}
r2.secret-key=${R2_SECRET_KEY:test-secret-key}
r2.cdn-bucket=${R2_CDN_BUCKET:}
r2.cdn-base-url=${R2_CDN_BASE_URL:}
cloudflare.zone-id=${CLOUDFLARE_ZONE_ID:}
cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}
motionville.frontend-origin=${FRONTEND_ORIGIN:${FRONTEND_URL:${APP_URL:http://localhost:5173}}}
motionville.dev-channel-bootstrap-enabled=${DEV_CHANNEL_BOOTSTRAP_ENABLED:false}

# Set absolute paths here through IntelliJ environment variables if PATH lacks FFmpeg.
motionville.ffmpeg=${FFMPEG_PATH:ffmpeg}
motionville.ffprobe=${FFPROBE_PATH:ffprobe}
motionville.live.auto-start=${LIVE_AUTOSTART:true}
motionville.live.binary=${MEDIAMTX_PATH:mediamtx}
motionville.live.config=${MEDIAMTX_CONFIG:./streaming/mediamtx.yml}
motionville.live.hls-url=${LIVE_HLS_URL:http://localhost:8888}
motionville.live.whip-url=${LIVE_WHIP_URL:http://localhost:8889}
motionville.frontend-public-url=${FRONTEND_PUBLIC_URL:${motionville.frontend-origin}}

# JWT Configuration
motionville.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
motionville.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
motionville.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
motionville.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
motionville.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Lax}

# Email & SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT:7000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT:7000}

# MotionVille Mail & Verification Settings
motionville.mail.enabled=${MOTIONVILLE_MAIL_ENABLED:true}
motionville.mail.from=${MOTIONVILLE_MAIL_FROM:katravathsuresh8917@gmail.com}
motionville.mail.from-name=${MOTIONVILLE_MAIL_FROM_NAME:MotionVille}
motionville.mail.admin-email=${MOTIONVILLE_ADMIN_EMAIL:${ADMIN_EMAIL:}}
motionville.mail.verification-url-base=${MOTIONVILLE_MAIL_VERIFICATION_URL:${motionville.frontend-public-url}/verify-email}
motionville.mail.reset-password-url-base=${MOTIONVILLE_MAIL_RESET_PASSWORD_URL:${motionville.frontend-public-url}/reset-password}
motionville.mail.token-validity-minutes=${MOTIONVILLE_MAIL_TOKEN_VALIDITY_MINUTES:1440}
motionville.mail.resend-cooldown-seconds=${MOTIONVILLE_MAIL_RESEND_COOLDOWN_SECONDS:60}
motionville.mail.max-resends-per-hour=${MOTIONVILLE_MAIL_MAX_RESENDS_PER_HOUR:5}
motionville.mail.mx-validation.enabled=${MOTIONVILLE_MAIL_MX_VALIDATION_ENABLED:true}
