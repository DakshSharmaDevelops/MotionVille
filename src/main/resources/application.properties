spring.application.name=MotionVille
spring.datasource.url=jdbc:postgresql://localhost:5432/motionville_db
spring.datasource.username=${DATABASE_USERNAME:motionville}
spring.datasource.password=${DATABASE_PASSWORD:motionville}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=510MB
spring.web.error.whitelabel.enabled=false
motionville.storage.directory=${MEDIA_DIRECTORY:./data/media}
r2.endpoint=${R2_ENDPOINT}
r2.bucket=${R2_BUCKET}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
