<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong — MotionVille</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main class="empty-state error-page">
    <div class="empty-symbol">!</div><h1>We couldn't complete that request</h1>
    <p th:text="${message} ?: 'The page may have moved or you may not have access.'">Request failed.</p>
    <a class="button button-primary" th:href="@{/}">Back to home</a>
</main>
</body>
</html>
