<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="topbar" th:fragment="siteHeader">
    <div class="brand-group">
        <button class="icon-button menu-toggle" type="button" aria-label="Toggle navigation"
                onclick="document.body.classList.toggle('sidebar-open')">☰</button>
        <a class="brand" th:href="@{/(feed='home')}"><span class="brand-mark">M</span> MotionVille</a>
    </div>
    <form class="search" method="get" th:action="@{/}">
        <input type="search" name="q" placeholder="Search videos" th:value="${query}">
        <input type="hidden" name="feed" th:if="${feed != null}" th:value="${feed}">
        <button type="submit" aria-label="Search">Search</button>
    </form>
    <nav class="nav">
        <a class="create-link" sec:authorize="isAuthenticated()" th:href="@{/videos/upload}"><span>＋</span> Create</a>
        <a sec:authorize="isAnonymous()" th:href="@{/login}">Sign in</a>
        <form sec:authorize="isAuthenticated()" method="post" th:action="@{/logout}">
            <button class="link-button" type="submit">Sign out</button>
        </form>
    </nav>
</header>
</body>
</html>
