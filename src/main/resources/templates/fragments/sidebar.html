<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside class="sidebar" th:fragment="siteSidebar">
    <nav class="side-nav" aria-label="Main navigation">
        <a class="side-link" th:classappend="${activePage == 'home' or activePage == null ? ' active' : ''}"
           th:href="@{/(feed='home')}"><span class="side-icon">⌂</span><span>Home</span></a>
        <a class="side-link" th:classappend="${feed == 'trending' ? ' active' : ''}"
           th:href="@{/(feed='trending')}"><span class="side-icon">↗</span><span>Trending</span></a>
        <a class="side-link" th:href="@{/}"><span class="side-icon">⌕</span><span>Explore</span></a>
        <a class="side-link" sec:authorize="isAuthenticated()"
           th:classappend="${activePage == 'subscriptions' ? ' active' : ''}"
           th:href="@{/subscriptions}"><span class="side-icon">▤</span><span>Subscriptions</span></a>
        <div class="side-divider"></div>
        <p class="side-label">YOUR SPACE</p>
        <a class="side-link" th:href="@{/}"><span class="side-icon">▣</span><span>All videos</span></a>
        <a class="side-link" sec:authorize="isAuthenticated()" th:href="@{/videos/upload}">
            <span class="side-icon">＋</span><span>Upload video</span>
        </a>
        <div class="side-divider"></div>
        <p class="side-note" sec:authorize="isAnonymous()">Sign in to subscribe to creators and join the conversation.</p>
        <a class="button button-primary side-signin" sec:authorize="isAnonymous()" th:href="@{/login}">Sign in</a>
        <div class="side-subscriptions" sec:authorize="isAuthenticated()" th:if="${subscriptions != null and !subscriptions.empty}">
            <p class="side-label">SUBSCRIPTIONS</p>
            <a class="side-link" th:each="subscription : ${subscriptions}"
               th:href="@{/channels/{id}(id=${subscription.channel.id})}">
                <span class="mini-avatar" th:text="${#strings.substring(subscription.channel.name, 0, 1).toUpperCase()}">C</span>
                <span th:text="${subscription.channel.name}">Creator</span>
            </a>
        </div>
    </nav>
</aside>
</body>
</html>
