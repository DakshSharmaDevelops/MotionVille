<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${channel.name} — MotionVille|">Channel — MotionVille</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main class="page-shell">
    <section class="channel-banner">
        <div class="avatar" th:text="${#strings.substring(channel.name, 0, 1).toUpperCase()}">M</div>
        <div class="channel-info">
            <p class="eyebrow" th:text="${channel.handle}">@channel</p>
            <h1 th:text="${channel.name}">Channel name</h1>
            <p class="muted" th:text="|${subscriberCount} subscribers|">Subscribers</p>
            <p th:if="${channel.description != null and !channel.description.isBlank()}" th:text="${channel.description}"></p>
        </div>
        <form sec:authorize="isAuthenticated()" th:if="${ownChannel}" method="post"
              th:action="@{/channels/{id}/edit(id=${channel.id})}" th:object="${form}" class="channel-edit">
            <label>Channel name<input th:field="*{name}" maxlength="120" required></label>
            <small class="field-error" th:errors="*{name}"></small>
            <label>Description<textarea th:field="*{description}" rows="3" maxlength="2000"></textarea></label>
            <button class="button button-outline" type="submit">Save channel</button>
        </form>
        <form sec:authorize="isAuthenticated()" th:if="${!ownChannel and !subscribed}" method="post"
              th:action="@{/channels/{id}/subscribe(id=${channel.id})}">
            <button class="button button-outline" type="submit"
                    th:text="'Subscribe'">Subscribe</button>
        </form>
        <form sec:authorize="isAuthenticated()" th:if="${!ownChannel and subscribed}" method="post"
              th:action="@{/channels/{id}/unsubscribe(id=${channel.id})}">
            <button class="button button-outline" type="submit">Unsubscribe</button>
        </form>
        <a sec:authorize="isAuthenticated()" th:if="${ownChannel}" class="button button-primary" th:href="@{/videos/upload}">Upload</a>
    </section>
    <section class="section-heading"><h2>Videos</h2><span class="muted" th:text="${videos.totalElements}">0</span></section>
    <div class="empty-state" th:if="${videos.empty}">
        <h3>No public videos yet</h3><p>When this creator shares a video, it will appear here.</p>
    </div>
    <div class="video-grid" th:unless="${videos.empty}">
        <th:block th:each="video : ${videos.content}">
            <div th:replace="~{fragments/video-card :: videoCard(${video})}"></div>
        </th:block>
    </div>
</main>
<script th:src="@{/js/video-thumbnails.js}" defer></script>
</body>
</html>
