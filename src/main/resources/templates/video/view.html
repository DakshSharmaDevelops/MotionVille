<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${video.title} — MotionVille|">Video — MotionVille</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>
<div class="app-layout watch-app-layout">
<div th:replace="~{fragments/sidebar :: siteSidebar}"></div>
<main class="watch-layout">
    <section class="watch-main">
        <video class="player" controls preload="metadata" th:src="@{/media/{key}(key=${video.storageKey})}">
            Your browser does not support HTML video.
        </video>
        <h1 class="watch-title" th:text="${video.title}">Video title</h1>
        <div class="watch-meta">
            <div>
                <a class="channel-name" th:href="@{/channels/{id}(id=${video.channel.id})}" th:text="${video.channel.name}">Channel</a>
                <span class="muted" th:text="| · ${video.viewCount} views|">Views</span>
            </div>
            <form sec:authorize="isAuthenticated()" method="post"
                  th:action="${liked ? '/videos/' + video.id + '/unlike' : '/videos/' + video.id + '/like'}">
                <button class="button button-outline" type="submit"
                        th:text="|${liked ? '♥ Liked' : '♡ Like'} · ${likeCount}|">Like</button>
            </form>
            <span class="button button-outline" sec:authorize="isAnonymous()" th:text="|♡ Like · ${likeCount}|">Like</span>
        </div>
        <div class="description-box">
            <p class="muted" th:text="${video.createdAt}">Published date</p>
            <p th:if="${video.category}" class="category-chip" th:text="${video.category}">Category</p>
            <p th:if="${video.description != null and !video.description.isBlank()}"
               class="video-description" th:text="${video.description}">Description</p>
            <p th:if="${video.tags != null and !video.tags.isBlank()}" class="muted" th:text="|Tags: ${video.tags}|">Tags</p>
            <a sec:authorize="isAuthenticated()" th:if="${ownVideo}" class="button button-outline"
               th:href="@{/videos/{id}/edit(id=${video.id})}">Edit details</a>
            <form sec:authorize="isAuthenticated()" th:if="${ownVideo}" method="post"
                  th:action="@{/videos/{id}/delete(id=${video.id})}"
                  onsubmit="return confirm('Delete this video? It will be removed from public listings.');">
                <button class="button button-outline" type="submit">Delete video</button>
            </form>
        </div>
        <section class="comments-section">
            <h2 th:text="|Comments (${comments.size()})|">Comments</h2>
            <form sec:authorize="isAuthenticated()" method="post"
                  th:action="@{/videos/{id}/comments(id=${video.id})}" th:object="${commentForm}" class="comment-form">
                <textarea th:field="*{body}" maxlength="2000" rows="3" placeholder="Add a comment…" required></textarea>
                <button class="button button-primary" type="submit">Comment</button>
            </form>
            <p sec:authorize="isAnonymous()" class="muted"><a th:href="@{/login}">Sign in</a> to join the conversation.</p>
            <div class="comment" th:each="comment : ${comments}">
                <div class="comment-avatar" th:text="${#strings.substring(comment.author.displayName, 0, 1).toUpperCase()}">U</div>
                <div>
                    <strong th:text="${comment.author.displayName}">Creator</strong>
                    <span class="muted" th:text="${comment.createdAt}">Date</span>
                    <p th:text="${comment.body}">Comment</p>
                    <form sec:authorize="isAuthenticated()"
                          th:if="${currentUserId != null and (currentUserId == comment.author.id or ownVideo)}"
                          method="post" th:action="@{/comments/{id}/delete(id=${comment.id})}">
                        <button class="link-button muted" type="submit">Delete</button>
                    </form>
                </div>
            </div>
            <div class="empty-inline" th:if="${comments.empty}">Be the first to comment.</div>
        </section>
    </section>
</main>
</div>
</body>
</html>
