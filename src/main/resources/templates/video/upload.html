<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload a video — MotionVille</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main class="form-page">
    <section class="form-panel">
        <p class="eyebrow">Share your work</p><h1>Upload a video</h1>
        <p class="muted">MP4, WebM, and MOV files up to 500 MB. Videos are stored as uploaded in this first release.</p>
        <div class="notice error" th:if="${uploadError}" th:text="${uploadError}"></div>
        <form method="post" enctype="multipart/form-data" th:action="@{/videos/upload}" th:object="${form}" class="form-stack">
            <label>Video file<input type="file" th:field="*{file}" accept="video/mp4,video/webm,video/quicktime" required></label>
            <label>Title<input th:field="*{title}" maxlength="180" required></label>
            <small class="field-error" th:errors="*{title}"></small>
            <label>Description<textarea th:field="*{description}" rows="5" maxlength="5000"></textarea></label>
            <small class="field-error" th:errors="*{description}"></small>
            <div class="form-row">
                <label>Category<input th:field="*{category}" maxlength="80" placeholder="Education, music…"></label>
                <label>Tags<input th:field="*{tags}" maxlength="500" placeholder="Separate tags with commas"></label>
            </div>
            <label>Visibility
                <select th:field="*{visibility}">
                    <option value="PUBLIC">Public</option>
                    <option value="PRIVATE">Private</option>
                </select>
            </label>
            <button class="button button-primary" type="submit">Upload video</button>
        </form>
    </section>
</main>
</body>
</html>
