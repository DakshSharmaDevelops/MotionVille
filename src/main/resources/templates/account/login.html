<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — MotionVille</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main class="auth-wrap">
    <section class="auth-card">
        <p class="eyebrow">Welcome back</p><h1>Sign in</h1>
        <div class="notice success" th:if="${param.registered}">Your account is ready. Sign in to continue.</div>
        <div class="notice error" th:if="${param.error}">Email or password was incorrect.</div>
        <form method="post" th:action="@{/login}" class="form-stack">
            <label>Email<input type="email" name="username" autocomplete="email" required></label>
            <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
            <button class="button button-primary full-width" type="submit">Sign in</button>
        </form>
        <p class="form-footnote">New to MotionVille? <a th:href="@{/register}">Create an account</a></p>
    </section>
</main>
</body>
</html>
