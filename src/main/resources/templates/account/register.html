<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account — MotionVille</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main class="auth-wrap">
    <section class="auth-card">
        <p class="eyebrow">Your next story starts here</p><h1>Create account</h1>
        <div class="notice error" th:if="${registrationError}" th:text="${registrationError}"></div>
        <form method="post" th:action="@{/register}" th:object="${form}" class="form-stack">
            <label>Display name<input th:field="*{displayName}" autocomplete="name" required></label>
            <small class="field-error" th:errors="*{displayName}"></small>
            <label>Username<input th:field="*{username}" autocomplete="username" required></label>
            <small class="field-error" th:errors="*{username}"></small>
            <label>Email<input type="email" th:field="*{email}" autocomplete="email" required></label>
            <small class="field-error" th:errors="*{email}"></small>
            <label>Password<input type="password" th:field="*{password}" autocomplete="new-password" minlength="10" required></label>
            <small class="field-error" th:errors="*{password}"></small>
            <p class="muted">Use 10–72 characters. Your password is stored as a one-way hash.</p>
            <button class="button button-primary full-width" type="submit">Create account</button>
        </form>
        <p class="form-footnote">Already have an account? <a th:href="@{/login}">Sign in</a></p>
    </section>
</main>
</body>
</html>
