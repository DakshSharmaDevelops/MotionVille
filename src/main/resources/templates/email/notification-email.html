<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Notification</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 24px; color: #1e293b;">
    <h2 style="color: #0f172a; margin-bottom: 16px;">New Notification</h2>
    <p style="font-size: 16px; line-height: 1.5;">Hello <strong th:text="${recipientName}">User</strong>,</p>
    <p style="font-size: 16px; line-height: 1.5; background-color: #f8fafc; padding: 16px; border-left: 4px solid #2563eb; border-radius: 4px;" th:text="${messageText}">Notification details</p>
    
    <div th:if="${actionUrl != null}" style="margin: 24px 0;">
        <a th:href="${actionUrl}" style="background-color: #2563eb; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: 600; display: inline-block;">View on MotionVille</a>
    </div>

    <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 24px 0;" />
    <p style="font-size: 12px; color: #94a3b8;">MotionVille Notifications Team</p>
</body>
</html>
