# Browser WebRTC publishing -> MediaMTX -> HLS playback on the local network.
logLevel: warn
api: true
apiAddress: 127.0.0.1:9997
authMethod: http
authHTTPAddress: http://127.0.0.1:8080/api/live/authorize
authHTTPExclude:
  - action: api
rtsp: false
rtmp: false
hls: true
hlsAddress: :8888
hlsAllowOrigins: ["*"]
# Low-latency fMP4 HLS supports WebRTC's Opus audio and short viewer delay.
hlsVariant: lowLatency
hlsAlwaysRemux: true
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts: [52.66.239.42, 52-66-239-42.sslip.io]
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
srt: false
moq: false
pathDefaults:
  overridePublisher: false
# Spring creates exact paths through the loopback-only control API.
paths: {}
