# Local browser WebRTC publishing -> MediaMTX -> HLS playback.
logLevel: warn
api: true
apiAddress: 127.0.0.1:9997
authMethod: http
authHTTPAddress: http://127.0.0.1:8080/api/live/authorize
authHTTPExclude:
  - action: api
rtsp: false
rtmp: true
rtmpAddress: 127.0.0.1:1935
hls: true
hlsAddress: 127.0.0.1:8888
hlsAllowOrigins: [http://localhost:5173]
# Browser WebRTC audio is Opus; MPEG-TS HLS only supports AAC.
hlsVariant: fmp4
hlsAlwaysRemux: true
hlsSegmentDuration: 2s
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcAllowOrigins: [http://localhost:5173]
webrtcLocalUDPAddress: 127.0.0.1:8189
srt: false
moq: false
pathDefaults:
  overridePublisher: false
# Spring creates exact paths through the loopback-only control API.
paths: {}
